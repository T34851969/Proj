name: Build & Release Cross-Platform App (Tauri 2.0)

# 架构: tests → prepare(共同产物一次) → 三条 OS 专属 job 并行(互不牵扯)
#   prepare: 前端 dist 构建一次(共享);tag 时预创建 Release(消灭并发上传冲突)
#   build-desktop-windows / client-linux / packaging-linux: 各自消费共享产物,互不依赖
#   Android: 独立 draft workflow(手动触发,本项目骨架阶段),不在此架构内
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    name: Backend & Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run backend tests (pytest)
        working-directory: backend
        run: python -m pytest -q

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install frontend deps
        working-directory: client
        run: npm ci --no-audit --no-fund

      - name: Run frontend tests (vitest)
        working-directory: client
        run: npm run test

      - name: Type check + build (vue-tsc)
        working-directory: client
        run: npm run build

  prepare:
    name: Shared Artifacts (frontend dist) & Pre-create Release
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install frontend deps
        working-directory: client
        run: npm ci --no-audit --no-fund

      - name: Build frontend (shared dist, built once)
        working-directory: client
        run: npm run build

      - name: Upload frontend dist (shared artifact)
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: client/dist
          retention-days: 14

      - name: Pre-create Release (avoid concurrent-create races)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --generate-notes
          echo "release ready: $GITHUB_REF_NAME"

  build-desktop-windows:
    name: Windows Desktop (NSIS)
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download shared frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: client/dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install frontend deps (node_modules for beforeBuildCommand)
        working-directory: client
        run: npm ci --no-audit --no-fund

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Prepare Backend Runtime (venv for staging)
        shell: pwsh
        env:
          PYTHONUTF8: '1'   # runner 默认 cp1252,pip 读含中文注释的 requirements.txt 会解码失败
        run: |
          python -m venv backend/.venv
          backend/.venv/Scripts/python.exe -m pip install --disable-pip-version-check -r backend/requirements.txt

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri

      - name: Build Tauri Desktop (Windows)
        working-directory: client
        run: npx tauri build

      - name: Rename installer to unified release name
        shell: pwsh
        run: Move-Item "client\src-tauri\target\release\bundle\nsis\*_x64-setup.exe" "client\src-tauri\target\release\bundle\nsis\ai-resume-client-x86_64-windows-setup.exe" -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AI-Resume-Windows-Desktop
          path: |
            client/src-tauri/target/release/bundle/nsis/ai-resume-client-x86_64-windows-setup.exe

      - name: Build backend server package (lite, self-contained)
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: powershell -ExecutionPolicy Bypass -File backend\scripts\build_release.ps1

      - name: Rename server zip to unified release name
        shell: pwsh
        run: Move-Item "dist-release\ai-resume-server-windows-x86_64-lite.zip" "dist-release\ai-resume-server-x86_64-windows-lite.zip" -Force

      - name: Generate SHA256SUMS
        shell: pwsh
        run: |
          $files = @(Get-Item dist-release\*.zip) + @(Get-Item client\src-tauri\target\release\bundle\nsis\ai-resume-client-x86_64-windows-setup.exe)
          $files | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist-release\SHA256SUMS.txt
          Get-Content dist-release\SHA256SUMS.txt

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            client/src-tauri/target/release/bundle/nsis/*.exe
            dist-release/*.zip
            dist-release/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  client-linux:
    name: Linux Desktop Client (deb/rpm/AppImage)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install frontend deps
        working-directory: client
        run: npm ci --no-audit --no-fund

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri

      - name: Install Linux build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Build Tauri Linux bundles (deb/rpm/AppImage)
        working-directory: client
        env:
          TAURI_SKIP_BACKEND: '1'   # Linux 客户端为纯客户端,不嵌后端(与 Windows sidecar 架构无关)
        run: npx tauri build --bundles deb,rpm,appimage

      - name: Rename bundles to unified release names
        run: |
          cd client/src-tauri/target/release/bundle
          mv deb/*.deb deb/ai-resume-client-x86_64-linux.deb
          mv rpm/*.rpm rpm/ai-resume-client-x86_64-linux.rpm
          mv appimage/*.AppImage appimage/ai-resume-client-x86_64-linux.AppImage

      - name: Upload Linux client bundles
        uses: actions/upload-artifact@v4
        with:
          name: ai-resume-client-linux
          path: |
            client/src-tauri/target/release/bundle/deb/*.deb
            client/src-tauri/target/release/bundle/rpm/*.rpm
            client/src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 14

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            client/src-tauri/target/release/bundle/deb/*.deb
            client/src-tauri/target/release/bundle/rpm/*.rpm
            client/src-tauri/target/release/bundle/appimage/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  packaging-linux:
    name: Linux Server Packages (deb/rpm)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Derive package version
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then VER="${GITHUB_REF_NAME#v}"; else VER=$(grep -oP '(?<="version": ")[^"]+' client/src-tauri/tauri.conf.json); fi
          echo "VER=$VER" >> "$GITHUB_ENV"

      - name: Download shared frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: client/dist

      - name: Setup pinned standalone CPython 3.11.18 (PBS 20261026, glibc 2.17 floor)
        run: |
          mkdir -p /tmp/pbs
          curl -fL --retry 3 -o /tmp/pbs/cpython.tar.gz "https://github.com/astral-sh/python-build-standalone/releases/download/20261026/cpython-3.11.18%2B20261026-x86_64-unknown-linux-gnu-install_only.tar.gz"
          tar -xzf /tmp/pbs/cpython.tar.gz -C /tmp/pbs
          echo "PATH=/tmp/pbs/python/bin:$PATH" >> "$GITHUB_ENV"

      - name: Build backend venv
        working-directory: backend
        run: |
          python -m venv .venv
          ./.venv/bin/python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Stage layout
        run: bash backend/scripts/build_release.sh --stage /tmp/layout

      - name: Assert runtime glibc floor (runtime red line)
        run: |
          floor=$(objdump -T /tmp/layout/ai-resume-server-linux-x86_64-lite/runtime/lib/libpython3.11.so.1.0 | grep -oE 'GLIBC_2\.[0-9]+' | sort -t. -k2 -n -u | tail -1 | cut -d. -f2)
          echo "runtime glibc floor: 2.$floor"
          if [ "$floor" -gt 17 ]; then echo "VIOLATION: floor above 2.17 -- target distros (Debian 12, glibc 2.36) will reject the bundled libpython"; exit 1; fi

      - name: Build deb
        run: bash packaging/linux/build-deb.sh --layout /tmp/layout/ai-resume-server-linux-x86_64-lite --version "$VER" --out dist-release

      - name: Build rpm
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm
          bash packaging/linux/build-rpm.sh --layout /tmp/layout/ai-resume-server-linux-x86_64-lite --version "$VER" --out dist-release

      - name: Rename packages to unified release names
        run: |
          cd dist-release
          mv ai-resume-server_${VER}-amd64.deb ai-resume-server-x86_64-linux.deb
          mv ai-resume-server-${VER}-1.x86_64.rpm ai-resume-server-x86_64-linux.rpm

      - name: Upload Linux server packages
        uses: actions/upload-artifact@v4
        with:
          name: ai-resume-server-linux-deb-rpm
          path: |
            dist-release/*.deb
            dist-release/*.rpm
          retention-days: 14

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/*.deb
            dist-release/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  client-android:
    name: Android Client (APK, arm64)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Locate preinstalled NDK
        run: echo "NDK_HOME=$(ls -d $ANDROID_HOME/ndk/* | sort -V | tail -1)" >> "$GITHUB_ENV"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install frontend deps
        working-directory: client
        run: npm ci --no-audit --no-fund

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri

      - name: Build unsigned APK (aarch64)
        working-directory: client
        run: npx tauri android build --apk --target aarch64

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > /tmp/ai-resume.keystore

      - name: Zipalign + sign + verify
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          BT=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -1)
          APK_DIR=client/src-tauri/gen/android/app/build/outputs/apk/universal/release
          APK_IN=$(ls "$APK_DIR"/*release*.apk | head -1)
          "$BT/zipalign" -f 4 "$APK_IN" aligned.apk
          "$BT/apksigner" sign --ks /tmp/ai-resume.keystore \
            --ks-pass "pass:$KEYSTORE_PASSWORD" --key-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" --out ai-resume-client-arm64-v8a-android.apk aligned.apk
          "$BT/apksigner" verify ai-resume-client-arm64-v8a-android.apk
          echo SIGNED-VERIFY-OK

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-resume-client-android-apk
          path: ai-resume-client-arm64-v8a-android.apk
          retention-days: 14

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ai-resume-client-arm64-v8a-android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
