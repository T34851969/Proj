name: Build & Release Cross-Platform App (Tauri 2.0)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    name: Backend & Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run backend tests (pytest)
        working-directory: backend
        run: python -m pytest -q

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install frontend deps
        working-directory: client
        run: npm ci --no-audit --no-fund

      - name: Run frontend tests (vitest)
        working-directory: client
        run: npm run test

      - name: Type check + build (vue-tsc)
        working-directory: client
        run: npm run build

  build-desktop-windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare Backend Runtime (venv for staging)
        shell: pwsh
        env:
          PYTHONUTF8: '1'   # runner 默认 cp1252,pip 读含中文注释的 requirements.txt 会解码失败
        run: |
          python -m venv backend/.venv
          backend/.venv/Scripts/python.exe -m pip install --disable-pip-version-check -r backend/requirements.txt

      - name: Install Frontend Dependencies
        working-directory: client
        run: npm ci

      - name: Build Tauri Desktop (Windows)
        working-directory: client
        run: npx tauri build

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AI-Resume-Windows-Desktop
          path: |
            client/src-tauri/target/release/bundle/nsis/*.exe

      - name: Build backend server package (lite, self-contained)
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: powershell -ExecutionPolicy Bypass -File backend\scripts\build_release.ps1

      - name: Generate SHA256SUMS
        shell: pwsh
        run: |
          $files = @(Get-Item dist-release\*.zip) + @(Get-Item client\src-tauri\target\release\bundle\nsis\*.exe)
          $files | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist-release\SHA256SUMS.txt
          Get-Content dist-release\SHA256SUMS.txt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            client/src-tauri/target/release/bundle/nsis/*.exe
            dist-release/*.zip
            dist-release/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
